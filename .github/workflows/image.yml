# Builds the Owin container on every push to main, smoke-tests it keyless, and publishes it to
# ghcr.io/zen-cronic/owin:<short-sha> and :latest. The Nebius endpoint pulls that image (DEPLOY.md).
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-smoke-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/zen-cronic/owin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build for linux/amd64 and load it locally
        run: |
          TAG=$(git rev-parse --short HEAD); echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --load -t "$IMAGE:$TAG" .
      - name: Run keyless and smoke-test
        run: |
          docker run --rm -d --name owin -p 8080:8080 "$IMAGE:$TAG"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(docker exec owin id -u)" = "10001"
          scripts/smoke.sh http://127.0.0.1:8080
          docker stop owin
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        run: |
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "pushed $IMAGE:$TAG and :latest" >> "$GITHUB_STEP_SUMMARY"
