<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Theme before first paint: ?theme=cN wins, then the saved choice, then c1 */(function(){var d=document.documentElement,k='owin-theme',ok=/^c[1-5]$/,t=null;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}if(t&&/^[1-5]$/.test(t))t='c'+t;if(t&&ok.test(t)){try{localStorage.setItem(k,t)}catch(e){}}else{try{t=localStorage.getItem(k)}catch(e){}}d.setAttribute('data-theme',ok.test(t||'')?t:'c1')})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Owin · Security review answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,100..900&family=Atkinson+Hyperlegible+Mono:wght@200..800&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;700&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@100..800&family=Oswald:wght@200..700&family=Public+Sans:wght@100..900&family=Work+Sans:wght@100..900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%236B4426%22/%3E%3Crect x=%223%22 y=%224%22 width=%2210%22 height=%227%22 fill=%22%23FCFBF7%22 stroke=%22%23D9AE62%22 stroke-width=%221.5%22/%3E%3Crect x=%225%22 y=%227%22 width=%226%22 height=%221.5%22 fill=%22%23B3202A%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/theme-c1.css">
<link rel="stylesheet" href="/theme-c2.css">
<link rel="stylesheet" href="/theme-c3.css">
<link rel="stylesheet" href="/theme-c4.css">
<link rel="stylesheet" href="/theme-c5.css">
</head>
<body>
<header class="top">
  <span class="word">owin</span>
  <span class="ctx"><span id="company">Lumen Notes</span> <span class="fict">fictional company</span></span>
  <span class="replay nw" id="replay">Real-source replay</span>
  <a class="judge nw" href="/judge">Start here</a>
  <div class="theme-switch" role="radiogroup" aria-labelledby="theme-l"><span class="tl" id="theme-l">Theme</span><label title="Catalogue"><input type="radio" name="theme" value="c1"><span>1</span><span class="sr"> Catalogue</span></label><label title="Broadsheet"><input type="radio" name="theme" value="c2"><span>2</span><span class="sr"> Broadsheet</span></label><label title="Ledger"><input type="radio" name="theme" value="c3"><span>3</span><span class="sr"> Ledger</span></label><label title="Civic form"><input type="radio" name="theme" value="c4"><span>4</span><span class="sr"> Civic form</span></label><label title="Photocopy"><input type="radio" name="theme" value="c5"><span>5</span><span class="sr"> Photocopy</span></label></div><select class="theme-select" id="theme-select" aria-label="Theme"><option value="c1">1 · Catalogue</option><option value="c2">2 · Broadsheet</option><option value="c3">3 · Ledger</option><option value="c4">4 · Civic form</option><option value="c5">5 · Photocopy</option></select>
</header>

<main class="wrap" id="app" aria-busy="true">
  <section class="catch" id="catch" aria-labelledby="catch-h">
    <p class="kicker" id="kicker"><span class="bar w12"></span></p>
    <h1 id="catch-h"><span class="bar w60"></span><span class="bar w40"></span></h1>
    <div class="todo" id="todo"></div>
    <p class="status" id="status" role="status" aria-live="polite">Loading the answers…</p>
    <aside class="summary stat-board" id="summary" aria-label="Summary"></aside>
    <i class="rule-draw" aria-hidden="true"></i>
  </section>

  <div class="panes" id="panes">
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" id="t-ans" aria-selected="true" aria-controls="p-ans">Answers<span class="ct" id="ct-ans"></span></button>
      <button role="tab" id="t-stack" aria-selected="false" aria-controls="p-stack" tabindex="-1">Your stack<span class="ct" id="ct-stack"></span></button>
    </div>

    <section class="pane stack" id="p-stack" role="tabpanel" aria-labelledby="t-stack">
      <div class="ph"><h2>Your stack</h2></div>
      <div id="endpoints"><div class="ep-row skel"><span class="bar w40"></span><span class="bar w70"></span></div><div class="ep-row skel"><span class="bar w30"></span><span class="bar w60"></span></div><div class="ep-row skel"><span class="bar w40"></span><span class="bar w50"></span></div></div>
      <div class="pages" id="pages"></div>
    </section>

    <section class="pane answers" id="p-ans" role="tabpanel" aria-labelledby="t-ans">
      <div class="ph"><h2>Security review: AI and data</h2>
        <div class="menu-wrap">
          <button class="btn ghost small" id="export-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu" disabled>Export<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
          <div class="menu" id="export-menu" role="menu" aria-labelledby="export-btn" hidden>
            <button role="menuitem" data-act="link" tabindex="-1"><b>Copy live link</b><span>Read-only buyer page with the vendor sentence behind every answer</span></button>
            <button role="menuitem" data-act="pdf" tabindex="-1"><b>Download PDF</b><span>Print-ready, light pages</span></button>
            <button role="menuitem" data-act="csv" tabindex="-1"><b>Download CSV</b><span>One row per question and endpoint</span></button>
          </div>
        </div>
      </div>
      <div id="answers"><div class="ans skel"><span class="bar w70"></span><span class="bar w90"></span><span class="bar w50"></span></div><div class="ans skel"><span class="bar w60"></span><span class="bar w80"></span></div><div class="ans skel"><span class="bar w50"></span><span class="bar w70"></span></div></div>
      <p class="foot" id="foot"></p>
    </section>
  </div>
</main>
<p class="sr" id="announce" role="status" aria-live="polite"></p>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/theme.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
